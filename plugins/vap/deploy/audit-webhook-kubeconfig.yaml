# Example --audit-webhook-config-file for the kube-apiserver: a kubeconfig
# whose "cluster" points at vap-plugin's audit webhook endpoint. The API
# server uses the client cert/CA here to establish trust, not to
# authenticate as a user, so no user credentials are required beyond a CA
# that validates vap-plugin's serving certificate.
apiVersion: v1
kind: Config
clusters:
  - name: vap-plugin
    cluster:
      server: https://vap-plugin.vap-plugin.svc:8443/webhook
      certificate-authority: /etc/kubernetes/pki/vap-plugin-ca.crt
contexts:
  - name: vap-plugin
    context:
      cluster: vap-plugin
current-context: vap-plugin

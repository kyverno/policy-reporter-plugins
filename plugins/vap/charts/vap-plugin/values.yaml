image:
  repository: ghcr.io/kyverno/vap-plugin
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  port: 8443
  # Fixed ClusterIP, needed when the audit-webhook-config-file kubeconfig
  # (server URL) must be generated before the Service exists - e.g. local
  # kind clusters wired at cluster-creation time, see scripts/setup.sh.
  # Leave empty for a normal auto-assigned ClusterIP.
  clusterIP: ""

# TLS is required: the Kubernetes audit webhook backend only accepts HTTPS.
# Either point certManager at an Issuer you control, or set
# tls.existingSecret to a pre-provisioned TLS secret with tls.crt/tls.key.
tls:
  certManager:
    enabled: false
    issuerRef:
      name: ""
      kind: ClusterIssuer
  existingSecret: ""

rbac:
  extraResources: []

config:
  # Set to false to disable the audit webhook receiver entirely, e.g. for a
  # replica that only serves the plugin API (see config.api.enabled below).
  # When disabled, the TLS listener port and volume are omitted too.
  server:
    enabled: true
  webhook:
    bufferSize: 1000
    workers: 4
  report:
    severity: ""
    category: ""
    labels: {}
    annotations: {}
    # Whether Deny-action results (requests Kubernetes actually blocked)
    # are persisted at all - see deploy/config.example.yaml for the
    # rationale behind defaulting to false.
    reportDenied: false
  leaderElection:
    enabled: false
  reconcile:
    interval: 10m
    orphanTTL: 24h
  # Policy Reporter plugin API (list/get ValidatingAdmissionPolicy details
  # for the Policy Reporter UI) - a separate plain-HTTP listener from the
  # TLS audit webhook receiver above.
  # Set to false to disable the plugin API server entirely, e.g. for a
  # replica that only receives the audit webhook (see config.server.enabled
  # above).
  api:
    enabled: true
    port: 8080
    debug: false
    basicAuth:
      username: ""
      password: ""
  logging:
    level: info
    development: false

resources: {}
  # limits:
  #   memory: 100Mi
  #   cpu: 10m
  # requests:
  #   memory: 75Mi
  #   cpu: 5m

nodeSelector: {}
tolerations: []
affinity: {}

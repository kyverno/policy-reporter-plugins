apiVersion: v1
kind: Service
metadata:
  name: {{ include "vap-plugin.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vap-plugin.labels" . | nindent 4 }}
spec:
  {{- with .Values.service.clusterIP }}
  clusterIP: {{ . }}
  {{- end }}
  selector:
    {{- include "vap-plugin.labels" . | nindent 4 }}
  ports:
    - name: https
      port: {{ .Values.service.port }}
      targetPort: https

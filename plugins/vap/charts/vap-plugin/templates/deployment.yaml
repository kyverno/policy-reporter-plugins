apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vap-plugin.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vap-plugin.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "vap-plugin.labels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "vap-plugin.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "vap-plugin.fullname" . }}
      containers:
        - name: vap-plugin
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["run", "--config=/etc/vap-plugin/config.yaml"]
          ports:
            - name: https
              containerPort: 8443
            - name: api
              containerPort: {{ .Values.config.api.port }}
          volumeMounts:
            - name: config
              mountPath: /etc/vap-plugin
              readOnly: true
            - name: tls
              mountPath: /etc/vap-plugin/tls
              readOnly: true
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "vap-plugin.fullname" . }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.existingSecret | default (printf "%s-tls" (include "vap-plugin.fullname" .)) }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
